<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Dilmurod Finance Tracker</title>
  <meta name="description" content="Personal finance tracker: cash flow, cash position, P&L, balance sheet, goals and targets.">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dilmurod Finance">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>💰 Dilmurod Finance</h1>
      <div class="actions">
        <button class="icon-btn" id="install-btn" style="display:none;" title="Install app">⬇️</button>
        <button class="icon-btn" id="settings-link" title="Settings">⚙️</button>
      </div>
    </header>
    <nav class="desktop-nav" id="desktop-nav"></nav>
    <main id="view"></main>
    <button class="fab" id="fab" title="Add transaction">+</button>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
