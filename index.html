<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don't Click The Button 🔴</title>
<style>
  :root{
    --pink: #ff5c8a;
    --pink-dark: #e8467a;
    --purple: #7b2ff7;
    --bg1: #2b0f3a;
    --bg2: #4a1259;
    --card: rgba(255,255,255,0.08);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    overflow: hidden;
  }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg2), var(--bg1) 70%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  /* floating background hearts */
  .bg-hearts{
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .bg-hearts span{
    position: absolute;
    bottom: -10%;
    font-size: 20px;
    opacity: 0.25;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp{
    to{ transform: translateY(-120vh) rotate(20deg); opacity: 0; }
  }

  #app{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    text-align: center;
    padding: 24px;
  }

  /* ---------- Intro screen ---------- */
  .screen{ display: none; flex-direction: column; align-items: center; gap: 18px; }
  .screen.active{ display: flex; }

  h1{
    font-size: clamp(22px, 5vw, 34px);
    margin: 0 0 4px;
  }
  p.sub{
    opacity: 0.8;
    margin: 0;
    line-height: 1.5;
    font-size: 15px;
  }

  input#nameInput{
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.25);
    background: var(--card);
    color: #fff;
    font-size: 16px;
    text-align: center;
    outline: none;
    width: 240px;
  }
  input#nameInput::placeholder{ color: rgba(255,255,255,0.5); }
  input#nameInput:focus{ border-color: var(--pink); }

  .btn-primary{
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none;
    color: #fff;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 92, 138, 0.35);
    transition: transform .15s ease;
  }
  .btn-primary:hover{ transform: translateY(-2px) scale(1.03); }
  .btn-primary:active{ transform: scale(0.97); }

  /* ---------- Game screen ---------- */
  #gameScreen{ position: relative; height: 80vh; width: 100%; }

  .hud{
    display:flex; justify-content: space-between; align-items:center;
    margin-bottom: 8px;
    font-size: 13px;
    opacity: 0.75;
  }
  .counter{
    font-variant-numeric: tabular-nums;
    background: var(--card);
    padding: 6px 14px;
    border-radius: 999px;
  }

  #message{
    min-height: 64px;
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(16px, 3.4vw, 22px);
    font-weight: 600;
    padding: 8px 12px;
    transition: opacity .15s ease;
  }

  #stage{
    position: relative;
    height: calc(100% - 120px);
    width: 100%;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(255,255,255,0.15);
    overflow: hidden;
  }

  .the-button{
    position: absolute;
    padding: 22px 30px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #ff4b6e, #d21f52);
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255, 30, 80, 0.45);
    user-select: none;
    transition: left .18s ease, top .18s ease, transform .12s ease, background .3s ease, width .2s ease, height .2s ease, opacity .3s ease;
    white-space: nowrap;
    z-index: 3;
  }
  .the-button:active{ transform: scale(0.94); }

  .decoy{
    position: absolute;
    padding: 16px 22px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #7b2ff7, #4a1259);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    opacity: 0.9;
    box-shadow: 0 8px 20px rgba(123, 47, 247, 0.35);
    z-index: 2;
    animation: pop .25s ease;
  }
  @keyframes pop{ from{ transform: scale(0); } to{ transform: scale(1); } }

  .floaty-emoji{
    position: absolute;
    pointer-events: none;
    font-size: 22px;
    animation: riseFade 1.1s ease forwards;
    z-index: 5;
  }
  @keyframes riseFade{
    0%{ transform: translateY(0) scale(1); opacity: 1; }
    100%{ transform: translateY(-70px) scale(1.4); opacity: 0; }
  }

  /* ---------- Finale ---------- */
  #finale{
    display:none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }
  #finale.active{ display: flex; }
  #finale h2{
    font-size: clamp(24px, 6vw, 40px);
    margin: 0;
    background: linear-gradient(135deg, #ff9ec4, #ffd6e8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #finale .stat{
    font-size: 15px;
    opacity: 0.85;
  }
  #finale .note{
    font-size: 17px;
    line-height: 1.6;
    max-width: 480px;
  }

  .confetti-heart{
    position: fixed;
    top: -5%;
    font-size: 22px;
    pointer-events: none;
    z-index: 50;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
  }

  footer{
    margin-top: 18px;
    font-size: 12px;
    opacity: 0.4;
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<div id="app">

  <!-- Intro -->
  <div class="screen active" id="introScreen">
    <h1>A Very Important Experiment 🔬</h1>
    <p class="sub">There is a button. It says not to click it.<br>Science requires a name for the test subject.</p>
    <input id="nameInput" type="text" placeholder="Her name..." maxlength="20">
    <button class="btn-primary" id="startBtn">Begin the Experiment 💘</button>
  </div>

  <!-- Game -->
  <div class="screen" id="gameScreen">
    <div class="hud">
      <span id="hudName"></span>
      <span class="counter">Clicks: <span id="clickCount">0</span></span>
    </div>
    <div id="message">🔴 There is a button below. Do not click it.</div>
    <div id="stage">
      <button class="the-button" id="theButton" style="left:50%; top:50%; transform:translate(-50%,-50%);">DON'T CLICK</button>
    </div>
  </div>

  <!-- Finale -->
  <div class="screen" id="finaleScreen">
    <div id="finale" class="active">
      <h2 id="finaleTitle">Congratulations 🎉</h2>
      <div class="stat" id="finaleStat"></div>
      <p class="note" id="finaleNote"></p>
      <button class="btn-primary" id="restartBtn">Do it all again 😍</button>
    </div>
  </div>

  <footer>made with love (and mild chaos) — for you</footer>
</div>

<script>
(function(){
  "use strict";

  const introScreen = document.getElementById('introScreen');
  const gameScreen = document.getElementById('gameScreen');
  const finaleScreen = document.getElementById('finaleScreen');
  const nameInput = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const hudName = document.getElementById('hudName');
  const clickCountEl = document.getElementById('clickCount');
  const messageEl = document.getElementById('message');
  const stage = document.getElementById('stage');
  const theButton = document.getElementById('theButton');
  const finaleTitle = document.getElementById('finaleTitle');
  const finaleStat = document.getElementById('finaleStat');
  const finaleNote = document.getElementById('finaleNote');
  const bgHearts = document.getElementById('bgHearts');

  const WIN_CLICKS = 47;
  let clicks = 0;
  let name = '';
  let decoys = [];

  // ---------- background floating hearts ----------
  function spawnBgHeart(){
    const el = document.createElement('span');
    el.textContent = ['💗','💕','💞','✨','💫'][Math.floor(Math.random()*5)];
    el.style.left = Math.random()*100 + '%';
    el.style.fontSize = (14 + Math.random()*18) + 'px';
    const dur = 8 + Math.random()*10;
    el.style.animationDuration = dur + 's';
    bgHearts.appendChild(el);
    setTimeout(()=> el.remove(), dur*1000);
  }
  setInterval(spawnBgHeart, 900);
  for(let i=0;i<6;i++) setTimeout(spawnBgHeart, i*300);

  // ---------- intro ----------
  const savedName = localStorage.getItem('dctb_name');
  if(savedName) nameInput.value = savedName;

  startBtn.addEventListener('click', startGame);
  nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') startGame(); });

  function startGame(){
    name = (nameInput.value || 'you').trim();
    localStorage.setItem('dctb_name', name);
    hudName.textContent = 'Hi, ' + name + ' 👋';
    introScreen.classList.remove('active');
    gameScreen.classList.add('active');
    resetButton();
  }

  restartBtn.addEventListener('click', () => {
    clicks = 0;
    clickCountEl.textContent = '0';
    decoys.forEach(d => d.remove());
    decoys = [];
    finaleScreen.classList.remove('active');
    gameScreen.classList.add('active');
    resetButton();
  });

  // ---------- messages ----------
  const messages = [
    "🔴 There is a button below. Do not click it.",
    "I told you not to.",
    "Seriously?",
    "Okay, you're doing this deliberately.",
    "Fine. Keep going, see what happens.",
    "The button has noticed you. It's nervous now.",
    "It's starting to run away from you. Good luck.",
    "It's getting smaller out of fear.",
    "It brought friends. One of them is real.",
    "This is chaos and I love it.",
    "You absolute menace. Keep clicking.",
    "The button respects you now, against its will.",
    "It's spinning. It doesn't know what else to do.",
    "Somewhere, a UX designer is crying.",
    "You are relentless. It's kind of attractive.",
    "The button is filing a complaint.",
    "Almost there. It doesn't know 'there' yet either.",
    "It's teleporting now. Purely out of spite.",
    "You know this button does nothing, right?",
    "And yet, here you are."
  ];

  function messageFor(n){
    if(n === 0) return messages[0];
    if(n-1 < messages.length) return messages[n-1];
    const extras = [
      "Still going. I admire the dedication.",
      "This button owes its therapist a visit.",
      "You could be doing literally anything else.",
      "The button is now just vibing sideways.",
      "Almost at greatness. Or nothing. Probably nothing.",
      "Legends say the clicking never stops.",
      "One day they'll write songs about this moment."
    ];
    return extras[n % extras.length];
  }

  // ---------- button behavior ----------
  const stageEmojis = ['🔴','🔴','🔴','😅','😳','🏃','🫣','🙈','👻','🌀','💫','🎭'];

  function resetButton(){
    theButton.style.left = '50%';
    theButton.style.top = '50%';
    theButton.style.transform = 'translate(-50%,-50%)';
    theButton.style.width = '';
    theButton.style.height = '';
    theButton.style.fontSize = '20px';
    theButton.textContent = "DON'T CLICK";
    theButton.style.background = 'linear-gradient(135deg, #ff4b6e, #d21f52)';
    theButton.style.opacity = '1';
    theButton.onmouseenter = null;
    messageEl.textContent = messageFor(0);
  }

  function randomPositionWithin(el){
    const rect = stage.getBoundingClientRect();
    const bw = el.offsetWidth || 140;
    const bh = el.offsetHeight || 60;
    const maxX = Math.max(rect.width - bw - 10, 10);
    const maxY = Math.max(rect.height - bh - 10, 10);
    const x = 10 + Math.random()*maxX;
    const y = 10 + Math.random()*maxY;
    return {x, y};
  }

  function moveButtonRandomly(el){
    const {x,y} = randomPositionWithin(el);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = 'none';
  }

  function spawnFloatEmoji(x, y, emoji){
    const f = document.createElement('div');
    f.className = 'floaty-emoji';
    f.textContent = emoji;
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    stage.appendChild(f);
    setTimeout(()=> f.remove(), 1100);
  }

  function spawnDecoy(){
    const d = document.createElement('button');
    d.className = 'decoy';
    d.textContent = ['NOPE','NOT THIS ONE','TRY AGAIN','FAKE','😏'][Math.floor(Math.random()*5)];
    const {x,y} = randomPositionWithin(d);
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.addEventListener('click', () => {
      spawnFloatEmoji(parseFloat(d.style.left), parseFloat(d.style.top), '😜');
      d.remove();
      decoys = decoys.filter(x => x !== d);
    });
    stage.appendChild(d);
    decoys.push(d);
  }

  function clearOldDecoys(){
    while(decoys.length > 4){
      const d = decoys.shift();
      d.remove();
    }
  }

  theButton.addEventListener('click', (e) => {
    clicks++;
    clickCountEl.textContent = clicks;

    if(clicks >= WIN_CLICKS){
      triggerFinale();
      return;
    }

    messageEl.style.opacity = 0;
    setTimeout(()=>{
      messageEl.textContent = messageFor(clicks);
      messageEl.style.opacity = 1;
    }, 80);

    spawnFloatEmoji(e.offsetX + theButton.offsetLeft, e.offsetY + theButton.offsetTop, stageEmojis[Math.min(clicks, stageEmojis.length-1)]);

    // evolve the button based on click count
    if(clicks < 3){
      // stays put, just a little shake
      theButton.style.transform = 'translate(-50%,-50%) rotate(' + (Math.random()*6-3) + 'deg)';
    } else if(clicks < 6){
      moveButtonRandomly(theButton);
    } else if(clicks < 10){
      moveButtonRandomly(theButton);
      const scale = Math.max(0.55, 1 - (clicks-6)*0.08);
      theButton.style.fontSize = (20*scale) + 'px';
    } else if(clicks < 16){
      moveButtonRandomly(theButton);
      if(Math.random() < 0.6) spawnDecoy();
      clearOldDecoys();
    } else if(clicks < 28){
      moveButtonRandomly(theButton);
      const hue = (clicks * 20) % 360;
      theButton.style.background = `linear-gradient(135deg, hsl(${hue},85%,60%), hsl(${hue+40},85%,45%))`;
      if(Math.random() < 0.4) spawnDecoy();
      clearOldDecoys();
    } else if(clicks < 40){
      moveButtonRandomly(theButton);
      const hue = (clicks * 20) % 360;
      theButton.style.background = `linear-gradient(135deg, hsl(${hue},85%,60%), hsl(${hue+40},85%,45%))`;
      theButton.textContent = ["COME ON","NO.","REALLY?","STOP","😤"][clicks % 5];
      if(Math.random() < 0.5) spawnDecoy();
      clearOldDecoys();
    } else {
      moveButtonRandomly(theButton);
      const hue = (clicks * 25) % 360;
      theButton.style.background = `linear-gradient(135deg, hsl(${hue},90%,60%), hsl(${hue+60},90%,45%))`;
      theButton.textContent = ["ALMOST","SO CLOSE","OKAY FINE","LAST WARNING","🙏"][clicks % 5];
      if(Math.random() < 0.6) spawnDecoy();
      clearOldDecoys();
    }
  });

  // when hovered late-game, dodge the cursor a bit
  theButton.addEventListener('mouseenter', () => {
    if(clicks >= 6 && clicks < WIN_CLICKS && Math.random() < 0.5){
      moveButtonRandomly(theButton);
    }
  });

  // ---------- finale ----------
  function confettiHearts(count){
    const emojis = ['💖','💕','💗','❤️','💞','✨'];
    for(let i=0;i<count;i++){
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'confetti-heart';
        h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        h.style.left = Math.random()*100 + 'vw';
        h.style.fontSize = (16 + Math.random()*20) + 'px';
        const dur = 3 + Math.random()*2.5;
        h.style.animationDuration = dur + 's';
        document.body.appendChild(h);
        setTimeout(()=> h.remove(), dur*1000 + 200);
      }, i*60);
    }
  }

  function triggerFinale(){
    decoys.forEach(d => d.remove());
    decoys = [];
    gameScreen.classList.remove('active');
    finaleScreen.classList.add('active');

    finaleTitle.textContent = 'Congratulations, ' + name + ' 🎉';
    finaleStat.textContent = 'Clicks: ' + clicks;
    finaleNote.textContent = "You have successfully accomplished absolutely nothing. Except, somehow, making me smile just thinking about you doing this. That's the whole game. I love you. 💕";

    confettiHearts(60);
  }

})();
</script>
</body>
</html>
