name: Deploy Finance App to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "brother/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # The main app stays at the site root so its existing URL and installed
      # PWAs are unaffected; the blank copy is published alongside it.
      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r app/. dist/
          if [ -d brother ]; then
            mkdir -p dist/brother
            cp -r brother/. dist/brother/
          fi
          test -f dist/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
